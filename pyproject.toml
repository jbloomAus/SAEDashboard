[tool.poetry]
name = "sae-dashboard"
version = "0.8.0"
description = "Open-source SAE visualizer, based on Anthropic's published visualizer. Forked / Detached from sae_vis."
authors = ["Callum McDougall <cal.s.mcdougall@gmail.com>", "Joseph Bloom, <jbloomaus@gmail.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
# The explicit CUDA 12.8 index pin is no longer needed for Blackwell coverage: from torch 2.11 the
# DEFAULT PyPI wheel is CUDA 13-based (`nvidia-cudnn-cu13`) and ships sm_100/sm_120 kernels, so
# `pip`/`poetry install` covers RTX 50-series and B100/B200 with no extra index. Dropping the pin
# also unblocks torch >= 2.12, which is not published to the cu128 index at all (it stops at 2.11).
# Trade-off to be aware of: CUDA 13 drops the oldest arches (sm_50-sm_70), so users on Maxwell/
# Pascal/Volta should install a cu12 build of torch themselves before installing this package.
torch = ">=2.7.1,<2.14"
einops = ">=0.7.0"
# Floor is 5.0.0 because of the torch pin above, not for any feature we use. Before 5.0.0,
# datasets/formatting/torch_formatter.py does a BARE `from torchvision.io import VideoReader`
# whenever torchvision is already imported; VideoReader no longer exists in current torchvision, so
# any torch-formatted access raises ImportError. datasets 5.0.0 wraps that import in try/except.
# With `torch >=2.7.1,<2.14` allowing modern torchvision, a `datasets <5` resolution is a broken
# combination rather than merely an old one -- it fails 7 of this repo's own pretokenization tests.
datasets = ">=5.0.0,<6.0.0"
dataclasses-json = "^0.6.4"
jaxtyping = "^0.2.28"
transformer-lens = "^2.2.0"
transformers = "^5.7.0"
eindex-callum = "^0.1.0"
rich = "^13.7.1"
matplotlib = "^3.8.4"
safetensors = ">=0.4.3,<0.9.0"
# `^0.12.3` capped typer below 0.13, which is incompatible with click >= 8.2 ("Secondary flag is not
# valid for non-boolean flag" at import time). Because typer is a hard dependency, that cap broke the
# `hf` CLI -- entirely, not just its buckets subcommand -- in any environment installing this package.
# typer is not imported anywhere in sae_dashboard (the pin is its only occurrence in the repo), so the
# ceiling bought nothing. Kept as a declared dependency rather than dropped, in case downstreams rely
# on it being pulled in, but widened to a range that works with current click.
typer = ">=0.12.3,<1.0.0"
sae-lens = "^6.43.0"
decode-clt = "^0.0.1"
hf-transfer = "^0.1.9"

[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"
ruff = "^0.3.7"
pytest = "^8.1.1"
ipykernel = "^6.29.4"
pyright = "^1.1.359"
pytest-profiling = "^1.7.0"
memray = "^1.12.0"
syrupy = "^4.6.1"
flake8 = "^7.0.0"
pytest-cov = "^5.0.0"
black = "^24.4.2"
pytest-memray = "^1.7.0"

[tool.poetry.scripts]
neuronpedia-runner = "sae_dashboard.neuronpedia.neuronpedia_runner:main"
neuronpedia-pretokenize = "sae_dashboard.neuronpedia.prompt_pretokenization:main"

[tool.isort]
profile = "black"
src_paths = ["sae_dashboard", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "none"
reportConstantRedefinition = "none"
reportUnknownLambdaType = "none"
reportPrivateUsage = "none"
reportPrivateImportUsage = "none"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_variables = ["sae_dashboard/__init__.py:__version__"]
version_toml = ["pyproject.toml:tool.poetry.version"]
build_command = "pip install poetry && poetry build"
branches = { main = { match = "main" } }
